# Keeps the Supabase free-tier project active by pinging the REST API twice
# weekly. Free projects pause after ~7 days without database activity.
#
# Setup (GitHub repo → Settings → Secrets and variables → Actions):
#   SUPABASE_URL          = https://YOUR-PROJECT.supabase.co
#   SUPABASE_ANON_KEY     = anon / publishable key (NOT the service_role key)
#
# Docs: https://supabase.com/docs/guides/platform/free-project-pausing

name: Supabase keep-alive

on:
  schedule:
    # Sunday and Wednesday at 06:00 UTC (safely under the 7-day window)
    - cron: "0 6 * * 0,3"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY GitHub secrets."
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

          # Lightweight read against a public table (counts as DB activity).
          response=$(curl -s -o /tmp/supabase-ping-body -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/posts?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP ${response}"
          cat /tmp/supabase-ping-body

          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "Supabase keep-alive succeeded."
          else
            echo "Supabase keep-alive failed."
            exit 1
          fi
