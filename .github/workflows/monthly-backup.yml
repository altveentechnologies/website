# Monthly encrypted backup of all Supabase data (tables + storage).
#
# Setup (GitHub repo → Settings → Secrets and variables → Actions):
#   SUPABASE_URL                  = https://YOUR-PROJECT.supabase.co
#                                 (already used by the keep-alive workflow)
#   SUPABASE_SERVICE_ROLE_KEY     = service_role key (Settings → API Keys)
#                                 NEVER use the anon key here — finance and
#                                 lead tables are blocked by RLS.
#   BACKUP_ENCRYPTION_PASSPHRASE  = a long password you keep in a password
#                                 manager. Needed later to decrypt a backup.
#
# Backups are published as draft GitHub Releases numbered backup-1, backup-2, …
# so they do not expire and stay visible only to people with write access.
# You can also run this workflow by hand from the Actions tab.
#
# Decrypt a downloaded file:
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
#     -in altveen-backup-1.zip.enc \
#     -out altveen-backup-1.zip
# Then unzip and restore:
#   npm run restore -- path/to/extracted-folder --confirm

name: Monthly data backup

on:
  schedule:
    # 1st of every month at 05:00 UTC (10:30 IST)
    - cron: "0 5 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-backup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-24.04
    steps:
      - name: Check required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          missing=0
          if [ -z "$SUPABASE_URL" ]; then
            echo "Missing secret SUPABASE_URL."
            missing=1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing secret SUPABASE_SERVICE_ROLE_KEY."
            missing=1
          fi
          if [ -z "$BACKUP_ENCRYPTION_PASSPHRASE" ]; then
            echo "Missing secret BACKUP_ENCRYPTION_PASSPHRASE."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add the secrets under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dump Supabase data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_DIR: backups/out
        run: node scripts/backup-data.mjs

      - name: Encrypt archive
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          N=1
          while gh release view "backup-${N}" >/dev/null 2>&1; do
            N=$((N + 1))
          done

          ARCHIVE="altveen-backup-${N}.zip"
          echo "DATE=${DATE}" >> "$GITHUB_ENV"
          echo "BACKUP_NUMBER=${N}" >> "$GITHUB_ENV"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          echo "ENCRYPTED=${ARCHIVE}.enc" >> "$GITHUB_ENV"

          # Zip contents only (no backups/out prefix) so restore can point at the unzipped folder.
          (cd backups/out && zip -r "${GITHUB_WORKSPACE}/${ARCHIVE}" .)
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in "${ARCHIVE}" \
            -out "${ARCHIVE}.enc" \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          rm -f "${ARCHIVE}"
          echo "Creating backup ${N} (${DATE})"
          ls -lh "${ARCHIVE}.enc"

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ENCRYPTED }}
          retention-days: 90
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="backup-${BACKUP_NUMBER}"
          NOTES="Encrypted monthly backup #${BACKUP_NUMBER} of Supabase tables and storage (${DATE}).

          Decrypt with the passphrase stored as BACKUP_ENCRYPTION_PASSPHRASE:

          \`\`\`
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \\
            -in ${ENCRYPTED} -out ${ARCHIVE}
          \`\`\`

          Unzip, then restore locally with:

          \`\`\`
          npm run restore -- path/to/extracted-folder --confirm
          \`\`\`"

          gh release create "$TAG" "$ENCRYPTED" --draft --title "Data backup ${BACKUP_NUMBER}" --notes "$NOTES"
